<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  
  <title>Sprout Logging Relay</title>
  <link rel="icon" href="/Assets/Logos/Sprout.ico" type="image/x-icon">

  <!-- Embeds -->

  <meta name="description" content="The Sprout Logging relay is an internal tool for Sprout developers to view and manage logs from various Sprout services.">

  <!-- Open Graph -->

  <meta property="og:title" content="Sprout Logging Relay">
  <meta property="og:description" content="The Sprout Logging relay is an internal tool for Sprout developers to view and manage logs from various Sprout services.">
  <meta property="og:image" content="/Assets/Logos/Sprout.png">

  <!-- Twitter Card (Thumbnail) -->

  <meta name="twitter:title" content="Sprout Logging Relay">
  <meta name="twitter:description" content="The Sprout Logging relay is an internal tool for Sprout developers to view and manage logs from various Sprout services.">
  
  <!-- Styles & Scripts -->
  
  <link rel="stylesheet" href="/Out/Styles/Main.min.css">
  <script type="module" src="/Out/Scripts/Main.js"></script> <!-- also minified -->

  <!-- External Libraries -->

  <!-- IonIcons -->

  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@latest/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@latest/dist/ionicons/ionicons.js"></script>
  
  <link rel="stylesheet" href="https://use.typekit.net/pge8obf.css"> <!-- Adobe Fonts -->

</head>

<body>

  <div class="Container Transparent Full Center DashLoading">

    <div class="Container Transparent VerticalFlex DashLoadingContainer">

      <div class="Container HorizontalFlex DashHeaderBranding DashLoadingVariant">

        <img src="/Assets/Logos/Sprout.svg" alt="Sprout" class="DashHeaderImage" draggable="false">

        <div class="DashHeaderTitle">Logging Relay</div>

      </div>

      <div class="DashNoAccessMessage" style="display: none;">You do not have access to the Sprout Logging Relay</div>

    </div>

  </div>

  <header class="Container Glass DashHeader">

    <div class="Container HorizontalFlex DashHeaderBranding">

      <img src="/Assets/Logos/Sprout.svg" alt="Sprout" class="DashHeaderImage" draggable="false">

      <div class="DashHeaderTitle">Logging Relay</div>

    </div>

    <div class="Container VerticalFlex DashHeaderMessage">


      
    </div>

    <div class="Container HorizontalFlex DashHeaderAccount">

      <ion-icon name="person-circle" class="DashHeaderAccountIcon"></ion-icon>
      
    </div> 

  </header>

  <main class="DashMain">


  </main>

  <!-- Context Menu -->

  <div class="DashContextMenu" style="display: none;">

  </div>

  <!-- Dialogs -->

  <div class="DashDialogOverlay" style="display: none;"></div>

  <!-- View Account Dialog -->

  <dialog class="Container VerticalFlex DashDialog DashViewAccountDialog" style="display: none;">

    <div class="Container Transparent HorizontalFlex DashDialogHeader">

      <div class="DashDialogTitle">Sprout Account</div>

    </div>

    <div class="Container Transparent HorizontalFlex DashDialogBody AccountView">

      <div class="Container Transparent Center DashDialogAccountIcon">

        <ion-icon name="person-circle" class="DashDialogAccountIcon"></ion-icon>

      </div>

      <div class="Container Transparent VerticalFlex DashDialogAccountInfo" style="align-items: start;">

          <div class="DashDialogAccountInfoItem DashHeaderMessageUser">Username</div>
          <div class="DashDialogAccountInfoItem DashHeaderMessageEmail">Email</div>

      </div>

    </div>

    <div class="Container Transparent HorizontalFlex DashDialogFooter">

      <Button class="DashDialogButton DashDialogButtonCancel">Close</Button>
      <Button class="DashDialogButton DashDialogButtonCancel" id="LogOut">Log Out</Button>

    </div>

  </dialog>
  
</body>

</html>
